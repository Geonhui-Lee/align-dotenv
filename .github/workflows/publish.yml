name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published v0.4.0 release to verify/recover
        required: true
        type: string

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  guard:
    if: vars.ENABLE_V040_RELEASE == 'true'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      baseline_run: ${{ steps.release.outputs.baseline_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require all successful validation gates for the existing published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-release-runs.mjs

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/align-dotenv
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable tagged source, versions and confirmed prerequisites
        env:
          EXPECTED_COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
          node scripts/check-versions.mjs --release
          node --input-type=module -e 'import fs from "node:fs"; import {assertPublicationApproved} from "./scripts/release-npm.mjs"; assertPublicationApproved(JSON.parse(fs.readFileSync("release-policy.json")),"0.4.0");'
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.guard.outputs.commit }}
          run-id: ${{ needs.guard.outputs.baseline_run }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Reinspect exact validated Python distributions without rebuilding
        run: python scripts/check-python-package.py dist
      - name: Refuse immutable version mismatches; skip only byte-identical completed publication
        id: existing
        run: python scripts/check-pypi-existing.py
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.existing.outputs.already_published != 'true'
