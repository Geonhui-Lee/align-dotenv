# Explicit coordinated-release opt-in, exact validated artifacts, protected npm environment.
name: Publish to npm (protected)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published v0.4.0 release to verify/recover (never creates a release)
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  guard:
    if: vars.ENABLE_NPM_PUBLISHING == 'true' && vars.ENABLE_V040_RELEASE == 'true'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      npm_run: ${{ steps.release.outputs.npm_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve existing published release and require all exact-commit source gates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-release-runs.mjs

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/align-dotenv
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      EXPECTED_COMMIT: ${{ needs.guard.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_PUBLISH_AUTHORIZED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Verify immutable tagged source and synchronized versions
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
          node scripts/check-versions.mjs --release
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.guard.outputs.commit }}
          run-id: ${{ needs.guard.outputs.npm_run }}
          github-token: ${{ github.token }}
          path: dist/release
      - name: Offline publication plan and guard tests (never rebuild artifacts)
        run: |
          node --test scripts/release-npm.test.mjs
          node scripts/release-npm.mjs dist/release --plan
      - name: Require confirmed publication prerequisites before attaching assets
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {assertPublicationApproved} from "./scripts/release-npm.mjs"; for (const p of ["release-policy.json", "dist/release/BUILD_METADATA.json"]) { const d=JSON.parse(fs.readFileSync(p)); assertPublicationApproved(d.releasePolicy ?? d,"0.4.0"); }'
      - name: Attach exact validated binaries, checksums and notices without overwriting
        run: python scripts/release-assets.py dist/release
      - name: Publish/verify Linux, publish/verify Windows, then publish/verify main via OIDC
        run: node scripts/release-npm.mjs dist/release --publish
