[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "align-dotenv"
version = "0.1.0"
description = "Align local dotenv files with templates while preserving existing values"
requires-python = ">=3.10"

[project.scripts]
align-dotenv = "align_dotenv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
